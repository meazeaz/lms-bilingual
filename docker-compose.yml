services:
  postgres:
    image: postgres:16-alpine
    container_name: almadany-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: almadany_admin
      POSTGRES_PASSWORD: almadany_secret_password_2028
      POSTGRES_DB: lms_bilingual
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almadany_admin -d lms_bilingual"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opsional: pgAdmin GUI untuk mengelola database dari browser di port 5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: almadany-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@almadany.sch.id
      PGADMIN_DEFAULT_PASSWORD: admin_secret_pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
